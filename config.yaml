paths:
  raw_data: "data/patients_med_data.csv"
  processed_data: "data/processed_patients.csv"
  model_output: "models/best_survival_model.joblib"
  preprocessor_output: "models/fitted_preprocessor.joblib"
  metrics_output: "models/evaluation_metrics.json"
  reports_dir: "reports"

data:
  target_col: "Survive"
  id_col: "ID"
  drop_cols:
    - "ID"
    - "Favourite color"
  numeric_cols:
    - "Age"
    - "Sodium"
    - "Creatinine"
    - "Platelets"
    - "Creatine phosphokinase"
    - "Blood Pressure"
    - "Hemoglobin"
    - "Height"
    - "Weight"
  binary_cols:
    - "Gender"
    - "Smoke"
  ordinal_cols:
    - "Ejection Fraction"
    - "Diabetes"

  encoding_categories:
    Gender: ["Female", "Male"]
    Smoke: ["No", "Yes"]
    Ejection Fraction: ["Low", "Normal", "High"]
    Diabetes: ["Normal", "Pre-diabetes", "Diabetes"]

  typo_maps:
    Survive:
      "1": 1
      "yes": 1
      "y": 1
      "survived": 1
      "true": 1
      "alive": 1
      "0": 0
      "no": 0
      "n": 0
      "died": 0
      "false": 0
      "deceased": 0
    Gender:
      "m": "Male"
      "male": "Male"
      "f": "Female"
      "female": "Female"
    Smoke:
      "y": "Yes"
      "yes": "Yes"
      "1": "Yes"
      "n": "No"
      "no": "No"
      "0": "No"
    Diabetes:
      "normal": "Normal"
      "no": "Normal"
      "n": "Normal"
      "0": "Normal"
      "pre-diabetes": "Pre-diabetes"
      "prediabetes": "Pre-diabetes"
      "pre diabetes": "Pre-diabetes"
      "diabetes": "Diabetes"
      "yes": "Diabetes"
      "y": "Diabetes"
      "1": "Diabetes"
    Ejection Fraction:
      "low": "Low"
      "l": "Low"
      "normal": "Normal"
      "norm": "Normal"
      "n": "Normal"
      "high": "High"
      "h": "High"

training:
  test_size: 0.2
  random_state: 42
  cv_folds: 5
  primary_metric: "roc_auc"
  classification_threshold: 0.50

models:
  DummyBaseline:
    enabled: true
    params:
      classifier__strategy: ["most_frequent"]
  LogisticRegression:
    enabled: true
    params:
      classifier__C: [0.01, 0.1, 1.0, 10.0]
  RandomForest:
    enabled: true
    params:
      classifier__n_estimators: [100, 200]
      classifier__max_depth: [5, 10, null]
      classifier__min_samples_split: [2, 5]
  GradientBoosting:
    enabled: true
    params:
      classifier__n_estimators: [100, 200]
      classifier__learning_rate: [0.05, 0.1]
      classifier__max_depth: [3, 5]
  SupportVectorMachine:
    enabled: true
    params:
      classifier__C: [0.5, 1.0, 5.0]
      classifier__kernel: ["rbf", "linear"]
